services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news_local_only
      POSTGRES_DB: news
    ports: ['127.0.0.1:54329:5432']
    volumes: [news_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U news -d news']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  news_data:
